<!DOCTYPE html>
<html>

<head>
    <title>World Map</title>
</head>

<body>

    <h1 align="center">World Continents</h1>

    <p align="center">
        Click on a continent to explore it.
    </p>

    <hr>

    <div align="center">

        <img src="worldMap.jpg"
           width="1200"
     height="800"
             usemap="#world">

        <map name="world">


<area shape="poly"
                  coords="65,150,180,130,300,150,390,230,350,330,250,350,180,300,120,250"
                  href="north-america.html"
                  alt="North America">

            <!-- South America -->
            <area shape="poly"
                  coords="300,390,380,420,440,470,410,550,370,650,330,610,315,520"
                  href="south-america.html"
                  alt="South America">

<area shape="rect"
      coords="500,130,700,230"
      href="europe.html"
      alt="Europe">

            <!-- Africa -->
            <area shape="poly"
                  coords="510,300,610,290,680,340,720,420,680,520,620,570,570,500,550,420,500,370"
                  href="africa.html"
                  alt="Africa">

            <!-- Asia -->
            <area shape="poly"
                  coords="720,120,850,100,1000,120,1120,160,1080,250,1000,300,930,350,850,330,780,280,700,230"
                  href="asia.html"
                  alt="Asia">

            <!-- Australia -->
            <area shape="poly"
                  coords="940,480,1030,470,1080,520,1050,580,960,570,920,530"
                  href="australia.html"
                  alt="Australia">

            <!-- Antarctica -->
            <area shape="poly"
                  coords="80,730,300,700,500,720,750,700,1000,710,1120,750,1100,790,100,790"
                  href="antarctica.html"
                  alt="Antarctica">

        </map>

    </div>
<br><br><br><br>
</body>

</html>
